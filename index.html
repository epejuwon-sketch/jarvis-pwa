<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>J.ARVIS</title>
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="J.ARVIS" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png" />
  <style>
    :root {
      --bg: #0b0f17;
      --rail: #0d121c;
      --card: #131a26;
      --card-hover: #182130;
      --input-bg: #111722;
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.24);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --blue: #3b82f6;
      --user-bg: #f8fafc;
      --user-fg: #0b0f17;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      overflow: hidden;
    }
    .shell { display: flex; height: 100dvh; width: 100%; }

    .sidebar {
      display: none;
      width: 224px;
      flex-shrink: 0;
      background: var(--rail);
      border-right: 1px solid var(--border);
      padding: 18px 12px;
      flex-direction: column;
      gap: 6px;
    }
    .side-brand {
      display: flex; align-items: center; gap: 9px;
      padding: 6px 10px 16px; font-weight: 600; font-size: 14px; letter-spacing: 0.08em;
    }
    .dot-blue { width: 8px; height: 8px; border-radius: 999px; background: var(--blue); box-shadow: 0 0 10px var(--blue); flex-shrink: 0; }
    .side-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px;
      color: var(--muted); font-size: 13px; cursor: pointer;
      border: 1px solid transparent; background: transparent; text-align: left; width: 100%;
    }
    .side-item.active { background: rgba(59, 130, 246, 0.14); color: var(--text); border-color: rgba(59, 130, 246, 0.25); }
    .side-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }

    .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 23, 0.9);
      backdrop-filter: blur(12px);
    }
    .status-left { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .brand-txt { font-weight: 600; letter-spacing: 0.06em; color: var(--text); }
    .online-txt { font-size: 11px; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
    .gear-btn {
      background: transparent; border: none; color: var(--muted);
      width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; cursor: pointer;
    }
    .gear-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }

    .content {
      flex: 1; overflow-y: auto; padding: 20px 16px 24px;
      display: flex; flex-direction: column; max-width: 780px; width: 100%; margin: 0 auto;
    }
    .hero { margin-bottom: 18px; }
    .hero h1 { margin: 0 0 4px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
    .hero .sub { font-size: 14px; color: var(--muted); }
    .hero .sync-meta { display: none; font-size: 12px; color: var(--dim); margin-top: 4px; }

    .cmd-box {
      background: var(--input-bg);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 12px 14px 10px;
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 16px;
    }
    .cmd-box:focus-within { border-color: rgba(248, 250, 252, 0.42); }
    textarea {
      width: 100%; border: none; outline: none; background: transparent;
      color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.45;
      min-height: 76px; max-height: 180px; resize: none;
    }
    textarea::placeholder { color: var(--dim); }
    .cmd-bar { display: flex; align-items: center; justify-content: space-between; }
    .cmd-tools { display: flex; align-items: center; gap: 10px; color: var(--dim); }
    .tool-ico { background: none; border: none; color: var(--dim); padding: 4px; cursor: pointer; display: grid; place-items: center; }
    .tool-ico:hover { color: var(--text); }
    .send-arrow {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer;
    }
    .send-arrow.ready { background: #f8fafc; color: #0b0f17; border-color: #f8fafc; }

    .quick-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .quick-row {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 16px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border);
      color: #cbd5e1; font-size: 14px; text-align: left; cursor: pointer;
    }
    .quick-row:active { background: var(--card-hover); }

    .quick-grid { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
    .quick-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    }
    .quick-card:hover { background: var(--card-hover); border-color: var(--border-strong); }
    .quick-card .q-title { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .quick-card .q-desc { font-size: 12px; color: var(--muted); }

    .section-label { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 10px; }
    .recent-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .recent-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: #cbd5e1; cursor: pointer; padding: 2px 0;
    }
    .recent-item:hover { color: #ffffff; }

    .messages { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .msg { max-width: 88%; display: flex; flex-direction: column; gap: 4px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }
    .route-tag { font-size: 11px; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; }
    .bubble { padding: 11px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble { background: var(--user-bg); color: var(--user-fg); font-weight: 500; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

    .bottom-nav {
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 6px calc(env(safe-area-inset-bottom) + 8px);
      background: var(--rail); border-top: 1px solid var(--border);
    }
    .nav-btn {
      background: none; border: none; color: var(--dim);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; cursor: pointer; padding: 4px 8px;
    }
    .nav-btn.active { color: var(--blue); }

    .modal {
      display: none; position: fixed; inset: 0; z-index: 60;
      background: rgba(2, 6, 15, 0.72); backdrop-filter: blur(6px);
      align-items: flex-end; justify-content: center;
    }
    .modal.open { display: flex; }
    .modal-panel {
      width: 100%; max-width: 540px; background: var(--card);
      border: 1px solid var(--border-strong); border-top-left-radius: 18px; border-top-right-radius: 18px;
      padding: 20px 18px calc(env(safe-area-inset-bottom) + 20px);
      display: flex; flex-direction: column; gap: 14px;
    }
    .modal-top { display: flex; justify-content: space-between; align-items: center; }
    .modal-top h2 { margin: 0; font-size: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); }
    .field input, .field select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border-strong);
      border-radius: 9px; padding: 10px 12px; font-size: 14px; outline: none;
    }
    .btn-row { display: flex; gap: 10px; }
    .btn-m { flex: 1; padding: 11px; border-radius: 9px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid var(--border); }
    .btn-ghost { background: var(--input-bg); color: var(--text); }
    .btn-solid { background: #f8fafc; color: #0b0f17; border-color: #f8fafc; }
    .sys-note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; }

    @media (min-width: 768px) {
      .sidebar { display: flex; }
      .bottom-nav { display: none; }
      .quick-rows { display: none; }
      .quick-grid { display: grid; }
      .hero .sub { display: none; }
      .hero .sync-meta { display: block; }
      .hero h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-brand"><span class="dot-blue"></span><span>J.ARVIS</span></div>
      <button class="side-item active" data-tab="Command">Command</button>
      <button class="side-item" data-tab="Agents">Agents</button>
      <button class="side-item" data-tab="Collectors">Collectors</button>
      <button class="side-item" data-tab="Research">Research</button>
      <button class="side-item" data-tab="Memory">Memory</button>
      <button class="side-item" data-tab="Workspaces">Workspaces</button>
      <button class="side-item" id="sideMore">More</button>
    </aside>

    <div class="main-col">
      <header>
        <div class="status-left">
          <span class="dot-blue"></span>
          <span class="brand-txt">J.ARVIS</span>
          <span class="online-txt">ONLINE</span>
        </div>
        <button class="gear-btn" id="openSettings" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0-.33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <div class="content" id="scrollArea">
        <div class="hero">
          <h1 id="heroTitle">Captain Saif</h1>
          <div class="sub" id="heroSub">Operator</div>
          <div class="sync-meta" id="syncMeta">Operational environment synchronized · Lagos, NG</div>
        </div>

        <form class="cmd-box" id="cmdForm">
          <textarea id="cmdInput" placeholder="Ask J.ARVIS..." rows="3"></textarea>
          <div class="cmd-bar">
            <div class="cmd-tools">
              <button type="button" class="tool-ico" id="attachBtn" title="Attach context">+</button>
              <button type="button" class="tool-ico" id="clipBtn" title="Insert quick directive">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </button>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <button type="button" class="tool-ico" id="voiceBtn" title="Voice input">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              </button>
              <button type="submit" class="send-arrow" id="sendArrow" title="Send">➤</button>
            </div>
          </div>
        </form>

        <div class="quick-rows">
          <button type="button" class="quick-row" data-prompt="Decompose my current objective into actionable milestones">→ Decompose Objective</button>
          <button type="button" class="quick-row" data-prompt="Verify deliverables and check runtime readiness">→ Verify Deliverables</button>
          <button type="button" class="quick-row" data-prompt="Analyze financial ledger and budget status">→ Analyze Financial Ledger</button>
        </div>

        <div class="quick-grid">
          <button type="button" class="quick-card" data-prompt="Automate business workflow and propose high-leverage operations">
            <div class="q-title">Automate Business Workflow</div>
            <div class="q-desc">Propose AI automation or side hustle ops</div>
          </button>
          <button type="button" class="quick-card" data-prompt="Launch a research deep dive with clear structured findings">
            <div class="q-title">Launch Research Deep Dive</div>
            <div class="q-desc">Fact-check, gather citations, &amp; compile reports</div>
          </button>
          <button type="button" class="quick-card" data-prompt="Review verification tests and check deliverable QA against specifications">
            <div class="q-title">Review Verification Tests</div>
            <div class="q-desc">Verify deliverable QA against specifications</div>
          </button>
          <button type="button" class="quick-card" data-prompt="Analyze financial ledger and evaluate budget, revenue, and cashflow stats">
            <div class="q-title">Analyze Financial Ledger</div>
            <div class="q-desc">Evaluate budget, revenue, and cashflow stats</div>
          </button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="section-label">Recent Conversations</div>
        <div class="recent-list">
          <div class="recent-item" data-prompt="Continue planning Caravan app deployment and funding workflow">Deploy Caravan app</div>
          <div class="recent-item" data-prompt="Review skincare routine notes and consistency schedule">Skincare Routine transformation</div>
          <div class="recent-item" data-prompt="Practice math problem solving and exam review">Math Exam post-UTME</div>
        </div>
      </div>

      <nav class="bottom-nav">
        <button type="button" class="nav-btn" data-tab="Home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Home</span>
        </button>
        <button type="button" class="nav-btn" data-tab="Agents">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Agents</span>
        </button>
        <button type="button" class="nav-btn active" data-tab="Command">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span>Command</span>
        </button>
        <button type="button" class="nav-btn" data-tab="Workspaces">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Workspaces</span>
        </button>
        <button type="button" class="nav-btn" id="openSettingsNav">
          <span style="font-size:15px;line-height:16px;">•••</span>
          <span>More</span>
        </button>
      </nav>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-panel">
      <div class="modal-top">
        <h2>J.ARVIS Settings</h2>
        <button type="button" class="gear-btn" id="closeSettings">✕</button>
      </div>
      <div class="field">
        <label for="apiKeyInput">Gemini API Key (optional)</label>
        <input type="password" id="apiKeyInput" placeholder="AIza..." autocomplete="off" />
      </div>
      <div class="field">
        <label for="modelInput">Model</label>
        <select id="modelInput">
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        </select>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-m btn-ghost" id="clearBtn">Clear Thread</button>
        <button type="button" class="btn-m btn-solid" id="saveBtn">Save</button>
      </div>
      <div class="sys-note" id="sysNote">Auto-routing active · Specialist selection handled automatically.</div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }

    const cmdForm = document.getElementById('cmdForm');
    const cmdInput = document.getElementById('cmdInput');
    const sendArrow = document.getElementById('sendArrow');
    const messagesEl = document.getElementById('messages');
    const scrollArea = document.getElementById('scrollArea');
    const modal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelInput = document.getElementById('modelInput');
    const sysNote = document.getElementById('sysNote');

    apiKeyInput.value = localStorage.getItem('jarvis_key') || '';
    modelInput.value = localStorage.getItem('jarvis_model') || 'gemini-2.5-flash';

    function updateHeroGreeting() {
      const hr = new Date().getHours();
      const greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
      if (window.innerWidth >= 768) {
        document.getElementById('heroTitle').textContent = `${greet}, Captain Saif.`;
        document.getElementById('heroSub').textContent = '';
        cmdInput.placeholder = 'Issue a directive to J.ARVIS...';
      } else {
        document.getElementById('heroTitle').textContent = 'Captain Saif';
        document.getElementById('heroSub').textContent = 'Operator';
        cmdInput.placeholder = 'Ask J.ARVIS...';
      }
    }
    updateHeroGreeting();
    window.addEventListener('resize', updateHeroGreeting);

    cmdInput.addEventListener('input', () => {
      sendArrow.classList.toggle('ready', cmdInput.value.trim().length > 0);
    });

    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        cmdForm.requestSubmit();
      }
    });

    function addBubble(role, text, tag = '') {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      if (tag) {
        const pill = document.createElement('span');
        pill.className = 'route-tag';
        pill.textContent = tag;
        wrap.appendChild(pill);
      }
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      wrap.appendChild(b);
      messagesEl.appendChild(wrap);
      scrollArea.scrollTop = scrollArea.scrollHeight;
      return b;
    }

    async function sendPrompt(text) {
      const clean = (text || '').trim();
      if (!clean) return;
      addBubble('user', clean);
      cmdInput.value = '';
      sendArrow.classList.remove('ready');
      const replyBubble = addBubble('bot', 'Selecting specialist & executing...', 'Auto-Router');

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: clean,
            api_key: localStorage.getItem('jarvis_key') || '',
            model: localStorage.getItem('jarvis_model') || 'gemini-2.5-flash'
          })
        });
        const data = await resp.json();
        const tagEl = replyBubble.previousElementSibling;
        if (tagEl && tagEl.classList.contains('route-tag')) {
          tagEl.textContent = data.agent_name || 'J.ARVIS';
        }
        replyBubble.textContent = data.reply || 'Completed.';
      } catch (err) {
        replyBubble.textContent = 'Connection error: ' + err.message;
      }
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    cmdForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sendPrompt(cmdInput.value);
    });

    document.querySelectorAll('[data-prompt]').forEach((el) => {
      el.addEventListener('click', () => sendPrompt(el.getAttribute('data-prompt')));
    });

    document.getElementById('attachBtn').addEventListener('click', () => {
      cmdInput.value = (cmdInput.value ? cmdInput.value + '\n' : '') + '[Context: Lagos, NG · Mobile Operator] ';
      cmdInput.focus();
      sendArrow.classList.add('ready');
    });

    document.getElementById('clipBtn').addEventListener('click', () => {
      sendPrompt('Summarize my active priorities and next steps');
    });

    document.getElementById('voiceBtn').addEventListener('click', () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        cmdInput.placeholder = 'Voice not supported in this browser — type directive...';
        return;
      }
      const rec = new SR();
      rec.lang = 'en-US';
      rec.onresult = (ev) => {
        cmdInput.value = ev.results[0][0].transcript;
        sendArrow.classList.add('ready');
      };
      rec.start();
    });

    async function openSettings() {
      modal.classList.add('open');
      try {
        const r = await fetch('/api/status');
        if (r.ok) {
          const s = await r.json();
          const aCount = s.agents_count ?? ((s.core_agents_count ?? 25) + (s.extensible_agents_count ?? 30));
          const cCount = s.collectors_count ?? 6;
          sysNote.textContent = `Auto-routing active · ${aCount} agents ready · ${cCount} collectors online`;
        }
      } catch {}
    }

    document.getElementById('openSettings').addEventListener('click', openSettings);
    document.getElementById('openSettingsNav').addEventListener('click', openSettings);
    document.getElementById('sideMore').addEventListener('click', openSettings);
    document.getElementById('closeSettings').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    document.getElementById('saveBtn').addEventListener('click', () => {
      localStorage.setItem('jarvis_key', apiKeyInput.value.trim());
      localStorage.setItem('jarvis_model', modelInput.value);
      modal.classList.remove('open');
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      messagesEl.innerHTML = '';
      modal.classList.remove('open');
    });

    document.querySelectorAll('[data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-tab]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.getAttribute('data-tab');
        if (tab !== 'Command' && tab !== 'Home') {
          sendPrompt(`Show a concise status summary for ${tab}`);
        }
      });
    });
  </script>
</body>
</html>
